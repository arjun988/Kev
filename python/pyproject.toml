[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kev"
version = "1.0.0"
description = "Python SDK for the Kev open System One decision engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Kev contributors" }]
keywords = ["kev", "system-one", "decision", "classification", "noul"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/arjun988/Kev"
Documentation = "https://github.com/arjun988/Kev#readme"

[tool.hatch.build.targets.wheel]
packages = ["kev"]

[tool.ruff]
line-length = 100
target-version = "py310"
